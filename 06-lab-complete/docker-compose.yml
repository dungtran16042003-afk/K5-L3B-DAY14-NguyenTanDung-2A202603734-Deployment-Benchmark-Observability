# Agent + Redis:  docker compose up --build
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env            # AGENT_API_KEY và các biến khác (không commit)
        required: false
    environment:
      # Trong mạng Compose, Redis được gọi bằng tên service (ghi đè giá trị trong .env)
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
